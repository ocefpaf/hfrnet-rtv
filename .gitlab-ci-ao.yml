# ===========================================================
# .gitlab-ci-ao.yml
# AO registration Jobs Definition
# 
# Purpose:
#   This file defines the deployment jobs handling container 
#   release and AO registration
#
# Usage:
#   Include this file in your main .gitlab-ci.yml like:
# 
#   include:
#      - local: .gitlab-ci-ao.yml
# ===========================================================

stages:
  - release
  - register

variables:
  ECR_IMAGE: ${ECR_REGISTRY}/ao-hfrnet:${CI_COMMIT_TAG}
  
include:
  - component:  ${CI_SERVER_FQDN}/ssboxes/common/assistt/ci-templates/release_ecr@ao
    inputs:
      job_name: "release/ecr"
      source:  ${SOURCE_IMAGE}
      destination: ${ECR_IMAGE} 
      destination_aws_profile: ${AWS_PROFILE} 
  - component:  ${CI_SERVER_FQDN}/ssboxes/common/assistt/ci-templates/ao_register@ao
    inputs:
      job_name: ao_register
      ecr_image: ${ECR_IMAGE} 
      aws_profile: ${AWS_PROFILE} 
      sa_name: '${SA_NAME}'
      rule_file: '${RULE_PATH}' 
      version: '${VERSION}'
      env: ${ENV}     

ao_register:
  parallel:
    matrix:
      - RULE_PATH: test_data/HFRNet-Production-Rules-akns-6km.yml
        SA_NAME: HFRNet-akns-6km  
        VERSION: ${CI_COMMIT_TAG}
      - RULE_PATH: test_data/HFRNet-Production-Rules-gak-1km.yml
        SA_NAME: HFRNet-gak-1km
        VERSION: ${CI_COMMIT_TAG}
      - RULE_PATH: test_data/HFRNet-Production-Rules-gak-2km.yml
        SA_NAME: HFRNet-gak-2km
        VERSION: ${CI_COMMIT_TAG}
      - RULE_PATH: test_data/HFRNet-Production-Rules-gak-6km.yml
        SA_NAME: HFRNet-gak-6km
        VERSION: ${CI_COMMIT_TAG}
      - RULE_PATH: test_data/HFRNet-Production-Rules-glna-500m.yml
        SA_NAME: HFRNet-glna-500m
        VERSION: ${CI_COMMIT_TAG}
      - RULE_PATH: test_data/HFRNet-Production-Rules-glna-1km.yml
        SA_NAME: HFRNet-glna-1km
        VERSION: ${CI_COMMIT_TAG}
      - RULE_PATH: test_data/HFRNet-Production-Rules-glna-2km.yml
        SA_NAME: HFRNet-glna-2km
        VERSION: ${CI_COMMIT_TAG}
      - RULE_PATH: test_data/HFRNet-Production-Rules-glna-6km.yml
        SA_NAME: HFRNet-glna-6km
        VERSION: ${CI_COMMIT_TAG}
      - RULE_PATH: test_data/HFRNet-Production-Rules-prvi-2km.yml
        SA_NAME: HFRNet-prvi-2km
        VERSION: ${CI_COMMIT_TAG}
      - RULE_PATH: test_data/HFRNet-Production-Rules-prvi-6km.yml
